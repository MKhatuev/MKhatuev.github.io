<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>LOGICA LOGISTICS</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

:root{
--bg:#f4f6fb;
--dark:#0b1324;
--accent:#1f4fff;
--text:#1d2433;
--muted:#6b7280;
--white:#ffffff;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
background:var(--bg);
color:var(--text);
line-height:1.6;
}

.container{
max-width:1200px;
margin:0 auto;
padding:0 24px;
}

nav{
position:fixed;
top:0;
width:100%;
height:70px;
background:var(--dark);
display:flex;
align-items:center;
z-index:1000;
}

.nav{
display:flex;
justify-content:space-between;
align-items:center;
width:100%;
}

.logo{color:#fff;font-weight:700}

.menu a{
color:#cbd5f5;
margin-left:25px;
text-decoration:none;
font-size:14px;
}

.menu a:hover{color:#fff}

.lang button{
background:none;
border:1px solid rgba(255,255,255,0.4);
color:#cbd5f5;
padding:5px 10px;
margin-left:6px;
border-radius:6px;
cursor:pointer;
font-size:12px;
}

.lang button.active,
.lang button:hover{
color:#fff;
border-color:#fff;
}

header{
padding-top:70px;
background:linear-gradient(rgba(11,19,36,.85),rgba(11,19,36,.85)),
url("https://images.unsplash.com/photo-1586528116311-ad8dd3c8310d?auto=format&fit=crop&w=1800&q=80");
background-size:cover;
background-position:center;
color:#fff;
}

.hero{
min-height:85vh;
display:flex;
align-items:center;
}

.hero h1{font-size:52px;margin-bottom:20px}

.hero p{max-width:700px;margin-bottom:40px;color:#d1d5db}

.hero-stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:25px;
}

.stat{
border-left:3px solid var(--accent);
padding-left:12px;
}

section{padding:90px 0}

h2{font-size:34px;margin-bottom:25px}

.lead{color:var(--muted);margin-bottom:40px;max-width:800px}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:28px;
}

.card{
background:#fff;
padding:22px;
border-radius:14px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.card img{
width:100%;
height:220px;
object-fit:cover;
border-radius:12px;
margin-bottom:16px;
}

.map-section{margin-top:80px}

.map-header{
text-align:center;
margin-bottom:30px;
}

.map-box{
border-radius:18px;
overflow:hidden;
box-shadow:0 20px 50px rgba(0,0,0,.12);
}

.map-box iframe{
width:100%;
height:420px;
border:0;
}

footer{
background:var(--dark);
color:#fff;
padding:40px 0;
text-align:center;
margin-top:80px;
}

@media(max-width:768px){
.menu{display:none}
.hero h1{font-size:38px}
.map-box iframe{height:300px}
}
</style>
</head>

<body>

<nav>
<div class="container nav">
<div class="logo">LOGICA LOGISTICS</div>
<div class="menu">
<a href="#about" data-i18n="nav_about">About</a>
<a href="#services" data-i18n="nav_services">Services</a>
<a href="#contact" data-i18n="nav_contact">Contact</a>
</div>
<div class="lang">
<button data-lang="en" class="active">EN</button>
<button data-lang="ru">RU</button>
</div>
</div>
</nav>

<header>
<div class="container hero">
<div>
<h1 data-i18n="hero_title">LOGICA LOGISTICS</h1>
<p data-i18n="hero_sub"></p>
<div class="hero-stats">
<div class="stat">
<strong data-i18n="stat1_title"></strong>
<span data-i18n="stat1_text"></span>
</div>
<div class="stat">
<strong data-i18n="stat2_title"></strong>
<span data-i18n="stat2_text"></span>
</div>
<div class="stat">
<strong data-i18n="stat3_title"></strong>
<span data-i18n="stat3_text"></span>
</div>
<div class="stat">
<strong data-i18n="stat4_title"></strong>
<span data-i18n="stat4_text"></span>
</div>
</div>
</div>
</div>
</header>

<section id="about">
<div class="container">
<h2 data-i18n="about_title"></h2>
<p class="lead" data-i18n="about_text"></p>
</div>
</section>

<section id="services">
<div class="container">
<h2 data-i18n="services_title"></h2>
<div class="grid">
<div class="card"><h3 data-i18n="serv1_title"></h3><p data-i18n="serv1_text"></p></div>
<div class="card"><h3 data-i18n="serv2_title"></h3><p data-i18n="serv2_text"></p></div>
<div class="card"><h3 data-i18n="serv3_title"></h3><p data-i18n="serv3_text"></p></div>
</div>
</div>
</section>

<section id="contact">
<div class="container">
<h2 data-i18n="contact_title"></h2>
<p class="lead" data-i18n="contact_text"></p>
<div class="grid">
<div class="card">
<h3>Email</h3>
<p>oskonov@logicalogistics.com</p>
</div>
<div class="card">
<h3 data-i18n="office_title"></h3>
<p data-i18n="office_text"></p>
</div>
</div>
</div>

<div class="map-section">
<div class="container">
<div class="map-header">
<h2 data-i18n="map_title"></h2>
<p data-i18n="map_sub"></p>
</div>
<div class="map-box">
<iframe src="https://www.google.com/maps?q=Technopark+Strogino,+Moscow&output=embed"></iframe>
</div>
</div>
</div>

</section>

<footer>
<p data-i18n="footer_text"></p>
</footer>

<script>
const dict={
en:{
nav_about:"About",
nav_services:"Services",
nav_contact:"Contact",
hero_title:"LOGICA LOGISTICS",
hero_sub:"International logistics and supply chain partner providing structured and reliable solutions.",
stat1_title:"International",stat1_text:"Global operations",
stat2_title:"Containers",stat2_text:"Sea & land",
stat3_title:"Warehousing",stat3_text:"Storage & consolidation",
stat4_title:"Control",stat4_text:"End-to-end coordination",
about_title:"Who we are",
about_text:"LOGICA LOGISTICS builds controlled and predictable supply chains.",
services_title:"Services",
serv1_title:"International transportation",serv1_text:"Sea and land cargo transport.",
serv2_title:"Container logistics",serv2_text:"FCL coordination and port handling.",
serv3_title:"Warehousing",serv3_text:"Storage and consolidation.",
contact_title:"Contact",
contact_text:"We are open for cooperation.",
office_title:"Office location",
office_text:"Technopark Strogino, Moscow, Russia",
map_title:"Our location",
map_sub:"Technopark Strogino, Moscow",
footer_text:"© 2026 LOGICA LOGISTICS"
},
ru:{
nav_about:"О компании",
nav_services:"Услуги",
nav_contact:"Контакты",
hero_title:"LOGICA LOGISTICS",
hero_sub:"Международный логистический партнёр.",
stat1_title:"Международные",stat1_text:"Глобальные операции",
stat2_title:"Контейнеры",stat2_text:"Море и суша",
stat3_title:"Складирование",stat3_text:"Хранение",
stat4_title:"Контроль",stat4_text:"Полный контроль",
about_title:"О компании",
about_text:"LOGICA LOGISTICS строит управляемые цепочки поставок.",
services_title:"Услуги",
serv1_title:"Международные перевозки",serv1_text:"Морские и наземные перевозки.",
serv2_title:"Контейнерная логистика",serv2_text:"FCL и портовая обработка.",
serv3_title:"Складская обработка",serv3_text:"Хранение и консолидация.",
contact_title:"Контакты",
contact_text:"Открыты для сотрудничества.",
office_title:"Адрес офиса",
office_text:"Технопарк Строгино, Москва, Россия",
map_title:"Наше расположение",
map_sub:"Технопарк Строгино, Москва",
footer_text:"© 2026 LOGICA LOGISTICS"
}
};

function setLang(lang){
document.querySelectorAll("[data-i18n]").forEach(el=>{
const key=el.dataset.i18n;
if(dict[lang][key]) el.textContent=dict[lang][key];
});
document.querySelectorAll(".lang button").forEach(b=>b.classList.remove("active"));
document.querySelector(`[data-lang="${lang}"]`).classList.add("active");
}

document.querySelectorAll(".lang button").forEach(btn=>{
btn.addEventListener("click",()=>setLang(btn.dataset.lang));
});

setLang("en");
</script>

</body>
</html>
